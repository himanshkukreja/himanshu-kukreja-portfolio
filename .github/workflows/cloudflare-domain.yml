# Moves systemdesignmastery.dev (apex + www) between Vercel and the sdm-course Worker.
#   attach: delete the two Vercel CNAMEs, then attach both hostnames to the Worker as Workers Custom Domains
#           (Cloudflare creates the proxied records and the certificate).
#   detach: remove the Worker custom domains, then recreate the Vercel CNAMEs (DNS only) = rollback.
#   test:   the same attach then detach on a throwaway hostname (cf-switch-test, on the staging Worker), checking the
#           records after each step, then removing it: run before a live switch (8 Nov 2026: a detach once crashed
#           halfway and left the apex without a record).
# Email routing, Brevo DKIM/SPF/DMARC, the wildcard and every other record are never touched.
name: cloudflare-domain

on:
  workflow_dispatch:
    inputs:
      action:
        description: "attach (to Cloudflare), detach (back to Vercel) or test (both on a throwaway hostname)"
        type: choice
        options: [attach, detach, test]

permissions:
  contents: read

jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ZONE: d5398c708f63d9bfb10962bb209da8ed
      ACTION: ${{ inputs.action }}
    steps:
      - name: Switch
        run: |
          node --input-type=module -e '
            const api = async (path, init = {}) => {
              const r = await fetch(`https://api.cloudflare.com/client/v4${path}`, { ...init, headers: { authorization: `Bearer ${process.env.CF_TOKEN}`, "content-type": "application/json" } });
              const text = await r.text(); // some calls (DELETE a Workers domain) answer 204 with no body
              const j = text ? JSON.parse(text) : { success: r.ok, result: null, errors: r.ok ? [] : [r.status] };
              if (!j.success) throw new Error(`${init.method || "GET"} ${path}: ${JSON.stringify(j.errors)}`);
              return j.result;
            };
            const { ACCOUNT, ZONE, ACTION } = process.env;
            const LIVE = { "systemdesignmastery.dev": "f0ca187af14f0b67.vercel-dns-017.com", "www.systemdesignmastery.dev": "cname.vercel-dns-016.com" };
            const TEST = { "cf-switch-test.systemdesignmastery.dev": "cname.vercel-dns-016.com" };
            const records = (host) => api(`/zones/${ZONE}/dns_records?name=${host}&per_page=50`);
            async function attach(hosts, service) {
              for (const host of Object.keys(hosts)) {
                const domains = await api(`/accounts/${ACCOUNT}/workers/domains?hostname=${host}`);
                for (const r of (await records(host)).filter((r) => ["CNAME", "A", "AAAA"].includes(r.type) && !domains.length)) {
                  await api(`/zones/${ZONE}/dns_records/${r.id}`, { method: "DELETE" });
                  console.log(`deleted ${r.type} ${host} -> ${r.content}`);
                }
                const d = await api(`/accounts/${ACCOUNT}/workers/domains`, { method: "PUT", body: JSON.stringify({ hostname: host, service, environment: "production", zone_id: ZONE }) });
                console.log(`attached ${host} -> ${service} (${d.id})`);
              }
            }
            async function detach(hosts) {
              for (const host of Object.keys(hosts)) {
                for (const d of await api(`/accounts/${ACCOUNT}/workers/domains?hostname=${host}`)) {
                  await api(`/accounts/${ACCOUNT}/workers/domains/${d.id}`, { method: "DELETE" });
                  console.log(`detached ${host} from ${d.service}`);
                }
                for (const r of (await records(host)).filter((r) => ["CNAME", "A", "AAAA"].includes(r.type))) await api(`/zones/${ZONE}/dns_records/${r.id}`, { method: "DELETE" });
                await api(`/zones/${ZONE}/dns_records`, { method: "POST", body: JSON.stringify({ type: "CNAME", name: host, content: hosts[host], proxied: false, ttl: 60 }) });
                console.log(`restored CNAME ${host} -> ${hosts[host]} (DNS only)`);
              }
            }
            const expect = async (host, ok, what) => {
              const recs = (await records(host)).filter((r) => ["CNAME", "A", "AAAA"].includes(r.type));
              const domains = await api(`/accounts/${ACCOUNT}/workers/domains?hostname=${host}`);
              const pass = ok(recs, domains);
              console.log(`${pass ? "PASS" : "FAIL"} ${what}: records ${JSON.stringify(recs.map((r) => `${r.type} ${r.content} proxied=${r.proxied}`))}, worker domains ${domains.length}`);
              if (!pass) throw new Error(`test failed: ${what}`);
            };
            if (ACTION === "attach") await attach(LIVE, "sdm-course");
            else if (ACTION === "detach") await detach(LIVE);
            else {
              const host = Object.keys(TEST)[0];
              await api(`/zones/${ZONE}/dns_records`, { method: "POST", body: JSON.stringify({ type: "CNAME", name: host, content: TEST[host], proxied: false, ttl: 60 }) }).catch((e) => console.log(`(start record: ${e.message})`));
              await expect(host, (r) => r.length === 1 && r[0].content === TEST[host], "start: Vercel-style CNAME");
              await attach(TEST, "sdm-course-staging");
              await expect(host, (r, d) => d.length === 1, "after attach: on the Worker");
              await detach(TEST);
              await expect(host, (r, d) => !d.length && r.length === 1 && r[0].type === "CNAME" && r[0].content === TEST[host], "after detach: CNAME back, no Worker domain");
              for (const r of await records(host)) await api(`/zones/${ZONE}/dns_records/${r.id}`, { method: "DELETE" });
              console.log(`removed ${host}`);
            }
          '

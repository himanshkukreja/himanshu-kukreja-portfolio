# Course site on Cloudflare Workers (OpenNext). Manual for now: "staging" deploys sdm-course-staging on
# workers.dev (no live traffic), "production" deploys sdm-course (the live domains once DNS moves).
# Needs: secret CLOUDFLARE_API_TOKEN + variable CLOUDFLARE_ACCOUNT_ID, and the Vercel ones (VERCEL_TOKEN,
# VERCEL_ORG_ID, VERCEL_PROJECT_ID) to pull the production env. Vercel's "sensitive" variables can't be pulled:
# ANTHROPIC_API_KEY, POSTHOG_PERSONAL_API_KEY (and BREVO_API_KEY) come from GitHub secrets of the same name.
name: cloudflare-deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "staging (workers.dev) or production"
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: cloudflare-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
      APP_ENV: production
      WENV: ${{ inputs.target == 'staging' && '--env staging' || '' }}
      CACHE_BUCKET: ${{ inputs.target == 'staging' && 'sdm-course-cache-staging' || 'sdm-course-cache' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Production env from Vercel (build env + Worker secrets)
        env:
          EXTRA_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXTRA_POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          EXTRA_BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          node scripts/cf/env-from-vercel.mjs .vercel/.env.production.local "$RUNNER_TEMP/worker-secrets.json"
          rm -f .vercel/.env.production.local

      - name: Build (OpenNext) + ASCII-only handler + _headers
        run: |
          npx opennextjs-cloudflare build
          node scripts/cf/postbuild.mjs

      - name: Size and encoding check
        run: |
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/cf-dist" $WENV | grep -E "Total Upload" | tee -a "$GITHUB_STEP_SUMMARY"
          node -e '
            const s = require("fs").readFileSync(process.argv[1], "utf8");
            const mib = Buffer.byteLength(s) / 1048576;
            console.log(`worker.js ${mib.toFixed(1)} MiB, non-ASCII: ${/[^\x00-\x7f]/.test(s)}`);
            if (mib > 60) throw new Error("Worker over 60 MiB (limit 64)");
            if (/[^\x00-\x7f]/.test(s)) throw new Error("Worker source is not ASCII (V8 would hold it two-byte)");
          ' "$RUNNER_TEMP/cf-dist/worker.js"

      - name: ISR cache bucket
        run: npx wrangler r2 bucket create "$CACHE_BUCKET" || echo "bucket exists"

      - name: Deploy
        run: npx wrangler deploy $WENV | tee "$RUNNER_TEMP/deploy.log" | grep -vE "^\s*$" | tail -20

      - name: Worker secrets
        run: npx wrangler secret bulk "$RUNNER_TEMP/worker-secrets.json" $WENV

      - name: Prerendered pages into the ISR cache
        run: npx opennextjs-cloudflare populateCache remote $WENV

      - name: Summary
        run: |
          grep -Eo "https://[a-z0-9.-]+workers.dev" "$RUNNER_TEMP/deploy.log" | head -1 | sed 's/^/Deployed: /' >> "$GITHUB_STEP_SUMMARY" || true

# Course site on Cloudflare Workers (OpenNext). Every push to main deploys production (sdm-course: systemdesignmastery.dev
# since 8 Nov 2026); by hand, "staging" deploys sdm-course-staging on workers.dev (no live traffic).
# Needs: secret CLOUDFLARE_API_TOKEN + variable CLOUDFLARE_ACCOUNT_ID, and the Vercel ones (VERCEL_TOKEN,
# VERCEL_ORG_ID, VERCEL_PROJECT_ID) to pull the production env. Vercel's "sensitive" variables can't be pulled:
# ANTHROPIC_API_KEY, POSTHOG_PERSONAL_API_KEY (and BREVO_API_KEY) come from GitHub secrets of the same name.
name: cloudflare-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "staging (workers.dev) or production"
        type: choice
        options: [staging, production]
        default: staging
      warm:
        description: "Warm the pages after deploying (always on for production; staging only when measuring speed)"
        type: boolean
        default: false

concurrency:
  group: cloudflare-${{ inputs.target || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
      # staging (workers.dev) is a course host (src/lib/site/hosts.ts, inlined at build); APP_ENV=preview there
      APP_ENV: ${{ inputs.target == 'staging' && 'preview' || 'production' }}
      # staging is also served at staging.systemdesignmastery.dev (a real zone: caches and sign-in behave as in production)
      NEXT_PUBLIC_EXTRA_COURSE_HOSTS: ${{ inputs.target == 'staging' && 'sdm-course-staging.markdrop-in.workers.dev,staging.systemdesignmastery.dev' || 'sdm-course.markdrop-in.workers.dev' }}
      WENV: ${{ inputs.target == 'staging' && '--env staging' || '' }}
      CACHE_BUCKET: ${{ inputs.target == 'staging' && 'sdm-course-cache-staging-apac' || 'sdm-course-cache-apac' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Production env from Vercel (build env + Worker secrets)
        env:
          EXTRA_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXTRA_POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          EXTRA_BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          node scripts/cf/env-from-vercel.mjs .vercel/.env.production.local "$RUNNER_TEMP/worker-secrets.json"
          rm -f .vercel/.env.production.local

      - name: Build (OpenNext) + ASCII-only handler + _headers
        run: |
          npx opennextjs-cloudflare build
          node scripts/cf/postbuild.mjs

      - name: Size and encoding check
        run: |
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/cf-dist" --metafile "$RUNNER_TEMP/cf-meta.json" $WENV | grep -E "Total Upload" | tee -a "$GITHUB_STEP_SUMMARY"
          # what the bundle is made of (Workers Paid: 10 MiB compressed per Worker): wrangler's view, OpenNext's own
          # server bundle metafile when it writes one, and the biggest files it ships
          node scripts/cf/bundle-report.mjs "$RUNNER_TEMP/cf-meta.json" 25 >> "$GITHUB_STEP_SUMMARY" || true
          for m in $(find .open-next -name "*.meta.json" -size +100k 2>/dev/null | head -3); do node scripts/cf/bundle-report.mjs "$m" 40 >> "$GITHUB_STEP_SUMMARY" || true; done
          { echo; echo "### Largest files in the Worker's server function"; echo '```'; find .open-next/server-functions .open-next/middleware -type f -size +300k -exec ls -l {} + 2>/dev/null | awk '{printf "%8.2f MiB  %s\n", $5/1048576, $9}' | sort -rn | head -30; echo '```'; echo "### Largest route bundles (.next/server/app)"; echo '```'; find .next/server/app -name "*.js" -size +300k -exec ls -l {} + 2>/dev/null | awk '{printf "%8.2f MiB  %s\n", $5/1048576, $9}' | sort -rn | head -25; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const s = require("fs").readFileSync(process.argv[1], "utf8");
            const mib = Buffer.byteLength(s) / 1048576;
            console.log(`worker.js ${mib.toFixed(1)} MiB, non-ASCII: ${/[^\x00-\x7f]/.test(s)}`);
            if (mib > 60) throw new Error("Worker over 60 MiB (limit 64)");
            if (/[^\x00-\x7f]/.test(s)) throw new Error("Worker source is not ASCII (V8 would hold it two-byte)");
          ' "$RUNNER_TEMP/cf-dist/worker.js"

      - name: ISR cache bucket
        run: npx wrangler r2 bucket create "$CACHE_BUCKET" --location apac || echo "bucket exists"

      # the search engine's own Worker first: the site Worker's SEARCH binding points at it
      - name: Deploy search Worker
        run: npx wrangler deploy -c wrangler.search.jsonc $WENV | grep -vE "^\s*$" | tail -8

      - name: Deploy
        # pipefail: a rejected upload (e.g. over a size limit) must fail the run, not hide behind the filters (8 Nov 2026)
        run: |
          set -o pipefail
          npx wrangler deploy $WENV | tee "$RUNNER_TEMP/deploy.log" | grep -vE "^\s*$" | tail -20

      - name: Worker secrets
        run: npx wrangler secret bulk "$RUNNER_TEMP/worker-secrets.json" $WENV

      - name: Prerendered pages into the ISR cache
        run: npx opennextjs-cloudflare populateCache remote $WENV

      - name: Summary
        run: |
          grep -Eo "https://[a-z0-9.-]+workers.dev" "$RUNNER_TEMP/deploy.log" | head -1 | sed 's/^/Deployed: /' >> "$GITHUB_STEP_SUMMARY" || true

  # a deploy starts with an empty ISR cache (keys carry the build id): re-render every page before visitors do
  warm:
    needs: deploy
    # staging warms only on request: its warm-ups were 45% of the account's CPU on 7-8 Nov 2026, all from testing
    if: inputs.target != 'staging' || inputs.warm
    uses: ./.github/workflows/cloudflare-warm.yml
    with:
      target: ${{ inputs.target || 'production' }}
